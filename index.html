<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手取り給与・税金一括シミュレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-lg sm:text-xl font-bold text-blue-600">📊 手取り給与・税金一括シミュレーター</h1>
            <span class="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full font-medium">無料Webツール群</span>
        </div>
    </header>

    <!-- メインレイアウト（左側：サイドメニュー、右側：メインコンテンツ） -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- 左側：サイドメニュー（関連ツール・広告枠 / 1カラム分） -->
        <aside class="space-y-6 order-2 lg:order-1">
            
            <!-- 関連ツール一覧 -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h3 class="text-sm font-bold text-slate-700 border-b pb-2 flex items-center gap-1.5">
                    <span>⚡</span> 便利な一括シミュレーター
                </h3>
                <ul class="space-y-2 text-xs">
                    <li>
                        <a href="index.html" class="block p-2.5 rounded-lg bg-blue-50 text-blue-700 font-bold border border-blue-200">
                            📊 手取り給与・税金一括シミュレーター
                        </a>
                    </li>
                    <li>
                        <a href="mortgage.html" class="block p-2.5 rounded-lg bg-slate-50 hover:bg-blue-50 hover:text-blue-600 transition font-medium text-slate-700 border border-slate-100">
                            🏠 住宅ローン返済＆借入限度額
                        </a>
                    </li>
                    <!-- 今後追加するツール枠の例 -->
                    <li>
                        <div class="block p-2.5 rounded-lg bg-slate-50 text-slate-400 border border-slate-100 cursor-not-allowed">
                            ⏳ フリーランス手取り計算 (準備中)
                        </div>
                    </li>
                </ul>
            </div>

            <!-- サイドバー広告枠 -->
            <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-6 text-center text-slate-400 text-xs">
                [ サイドバー広告 ]
            </div>

        </aside>

        <!-- 右側：メインコンテンツ (3カラム分) -->
        <div class="lg:col-span-3 space-y-6 order-1 lg:order-2">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 入力フォーム -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-base font-bold border-b pb-2 text-slate-700">条件入力</h2>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">年収 (万円)</label>
                        <input type="number" id="salary" value="500" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">年齢</label>
                        <input type="number" id="age" value="30" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">扶養家族の人数</label>
                        <input type="number" id="dependents" value="0" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <button onclick="calcSalary()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-blue-700 transition shadow-md">
                        計算する
                    </button>
                </div>

                <!-- 結果表示エリア -->
                <div class="space-y-4">
                    <div class="bg-blue-50 border border-blue-200 p-5 rounded-2xl shadow-sm">
                        <h2 class="text-xs font-bold text-blue-700 uppercase tracking-wider">推定手取り額</h2>
                        <div class="mt-3 space-y-2">
                            <div class="flex justify-between items-baseline">
                                <span class="text-xs text-slate-600">年間手取り:</span>
                                <span class="text-xl font-black text-blue-900" id="netAnnual">-- 万円</span>
                            </div>
                            <div class="flex justify-between items-baseline border-t border-blue-200 pt-2">
                                <span class="text-xs text-slate-600">月給換算(目安):</span>
                                <span class="text-sm font-bold text-slate-700" id="netMonthly">-- 万円</span>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50 border border-slate-200 p-5 rounded-2xl shadow-sm space-y-2 text-xs">
                        <h3 class="font-bold text-slate-700">控除・税金の内訳（目安）</h3>
                        <div class="flex justify-between"><span class="text-slate-500">所得税:</span><span id="incomeTax" class="font-medium">-- 万円</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">住民税:</span><span id="residentTax" class="font-medium">-- 万円</span></div>
                        <div class="flex justify-between"><span class="text-slate-500">社会保険料:</span><span id="socialInsurance" class="font-medium">-- 万円</span></div>
                    </div>
                </div>
            </div>

            <!-- コンテンツ内広告枠 -->
            <div class="bg-white border border-dashed border-slate-300 rounded-2xl p-6 text-center text-slate-400 text-xs">
                [ 広告スペース（Google アドセンスなど） ]
            </div>

        </div>

    </main>

    <!-- フッター -->
    <footer class="bg-white border-t border-slate-200 text-center py-6 text-xs text-slate-400 mt-auto">
        &copy; 2026 ウェブ便利ツール集 All Rights Reserved.
    </footer>

    <!-- 簡易計算ロジック -->
    <script>
        function calcSalary() {
            const salary = parseFloat(document.getElementById('salary').value);
            if (isNaN(salary)) {
                alert('年収を入力してください。');
                return;
            }
            // 簡易的な目安計算ロジック
            const social = salary * 0.15; // 社会保険料約15%
            const taxable = salary - social - 55; // 基礎控除等簡易計算
            const incomeTax = Math.max(0, taxable * 0.1); // 所得税簡易
            const residentTax = Math.max(0, taxable * 0.1); // 住民税簡易
            const totalTax = social + incomeTax + residentTax;
            const net = salary - totalTax;

            document.getElementById('netAnnual').innerText = Math.round(net * 10) / 10 + ' 万円';
            document.getElementById('netMonthly').innerText = Math.round((net / 12) * 10) / 10 + ' 万円';
            document.getElementById('incomeTax').innerText = Math.round(incomeTax * 10) / 10 + ' 万円';
            document.getElementById('residentTax').innerText = Math.round(residentTax * 10) / 10 + ' 万円';
            document.getElementById('socialInsurance').innerText = Math.round(social * 10) / 10 + ' 万円';
        }

        window.onload = calcSalary;
    </script>
</body>
</html>
